<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}.shell{min-height:100vh}
.top{position:sticky;top:0;z-index:40;background:rgba(244,246,250,.94);backdrop-filter:blur(16px);border-bottom:1px solid rgba(230,235,242,.9)}.top-in{max-width:1240px;margin:auto;padding:11px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.logo{width:35px;height:35px;border-radius:11px;background:var(--nav);color:#fff;display:grid;place-items:center;font-weight:800}.brand h1{margin:0;font-size:17px}.brand p{margin:1px 0 0;color:var(--muted);font-size:10px}.actions{display:flex;gap:7px}.btn{border:1px solid var(--line);background:#fff;color:#46546a;border-radius:10px;padding:8px 11px;cursor:pointer}.btn:active{transform:scale(.98)}
.main{max-width:1240px;margin:auto;padding:17px 18px 48px}.hero{border-radius:20px;background:linear-gradient(135deg,#0b1220,#1b3157);color:#fff;padding:19px;box-shadow:0 14px 40px rgba(8,18,35,.18)}.hero-line{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.eyebrow{font-size:10px;color:rgba(255,255,255,.58)}.date{font-size:26px;font-weight:850;letter-spacing:-.5px}.hero-sub{font-size:10px;color:rgba(255,255,255,.65)}.health{font-size:10px;padding:6px 9px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.08);border-radius:999px;white-space:nowrap}.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:17px}.metric{padding:10px 11px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08)}.metric span{display:block;color:rgba(255,255,255,.57);font-size:9px}.metric b{display:block;margin-top:2px;font-size:17px}
.nav{display:flex;gap:7px;overflow:auto;padding:13px 0 5px;scrollbar-width:none}.nav button{border:1px solid var(--line);background:#fff;color:#59677b;border-radius:999px;padding:8px 12px;white-space:nowrap;cursor:pointer}.nav button.active{background:var(--nav);color:#fff;border-color:var(--nav)}
.view{display:none}.view.on{display:block}.head{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:15px 2px 9px}.head h2{font-size:17px;margin:0}.head p{font-size:10px;color:var(--muted);margin:2px 0 0}.head-right{font-size:10px;color:var(--muted)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:0 2px 9px rgba(20,35,60,.025)}.pad{padding:14px}.small-label{font-size:10px;color:var(--muted)}.num{font-size:22px;font-weight:850;margin-top:4px}.sub{font-size:10px;color:var(--muted)}.divider{height:1px;background:var(--line);margin:12px 0}.tag{display:inline-flex;align-items:center;border-radius:999px;padding:4px 7px;font-size:9px;font-weight:700;background:var(--green2);color:var(--green)}.tag.warn{background:var(--amber2);color:var(--amber)}.tag.bad{background:var(--red2);color:var(--red)}.click{cursor:pointer;transition:.16s}.click:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.radar{display:grid;grid-template-columns:1.35fr .65fr;gap:11px}.radar-main{padding:15px}.radar-row{display:grid;grid-template-columns:105px 1fr 55px;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)}.radar-row:last-child{border-bottom:0}.radar-name{font-weight:700;font-size:11px}.track{height:7px;border-radius:99px;background:#eef2f6;overflow:hidden}.track i{display:block;height:100%;border-radius:99px;background:#3974e8}.radar-pct{text-align:right;font-size:10px;color:var(--muted)}.side-stack{display:grid;gap:11px}.quick{padding:13px}.quick strong{display:block;font-size:12px}.quick span{font-size:10px;color:var(--muted)}
.val-card{padding:14px;min-height:205px}.val-top{display:flex;justify-content:space-between;gap:8px}.title{font-weight:780;font-size:12px}.code{font-size:9px;color:var(--muted);margin-top:1px}.primary{font-size:23px;font-weight:850;margin:10px 0 7px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:6px}.fact{padding:7px 8px;background:#f8fafc;border-radius:9px}.fact span{display:block;font-size:9px;color:var(--muted)}.fact b{font-size:12px}.percent{margin-top:8px}.percent-top{display:flex;justify-content:space-between;font-size:9px;color:var(--muted)}.percent-bar{height:6px;background:#edf1f5;border-radius:99px;overflow:hidden;margin-top:4px}.percent-bar i{display:block;height:100%;border-radius:99px;background:#3974e8}.observe{margin-top:9px;padding:9px;border:1px solid var(--line);background:#fbfcfe;border-radius:10px;font-size:10px;color:#556277}.observe b{color:#23314a}
.toolbar{display:flex;gap:7px;margin:10px 0}.search{flex:1;min-width:0;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;outline:none}.filter{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px;color:#526076;cursor:pointer}.filter.active{background:var(--blue2);border-color:#cadbff;color:var(--blue)}
.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:15px}.table{width:100%;min-width:760px;border-collapse:collapse}.table th,.table td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{font-size:9px;color:var(--muted);background:#fbfcfe}.table td{font-size:11px}.table td:first-child{font-weight:700}.table tr:last-child td{border-bottom:0}
.alloc-layout{display:grid;grid-template-columns:300px 1fr;gap:11px}.alloc-summary{padding:18px}.alloc-total{font-size:29px;font-weight:850}.alloc-list{padding:5px 14px}.alloc-item{padding:11px 0;border-bottom:1px solid var(--line)}.alloc-item:last-child{border-bottom:0}.alloc-head{display:flex;justify-content:space-between}.alloc-name{font-weight:700;font-size:11px}.alloc-meta,.alloc-foot{font-size:9px;color:var(--muted)}.alloc-track{height:6px;background:#edf1f5;border-radius:99px;overflow:hidden;margin:6px 0}.alloc-track i{display:block;height:100%;border-radius:99px;background:#3974e8}
.health-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.health-card{padding:13px}.health-num{font-size:22px;font-weight:850;margin-top:5px}.issue{padding:10px;border-radius:10px;background:var(--amber2);border:1px solid #f0dfac;color:#715511;font-size:10px;margin-bottom:7px}.okbox{padding:12px;background:var(--green2);border:1px solid #cdeee0;border-radius:11px;color:#17684f;font-size:11px}
.history-list{display:grid;gap:8px}.history-item{padding:12px 14px}.history-top{display:flex;justify-content:space-between}.history-date{font-weight:780}.history-meta{display:flex;gap:15px;color:var(--muted);font-size:9px;margin-top:5px}.history-chart{padding:13px}.chart-toolbar{display:flex;gap:7px;align-items:center;margin-top:9px}.chart-select{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 9px;color:#46546a}.chart-box{height:220px;display:grid;place-items:center;border:1px dashed #dfe5ed;border-radius:11px;color:var(--muted);font-size:10px;background:#fbfcfe;overflow:hidden}.chart-box svg{width:100%;height:100%}.chart-caption{font-size:9px;color:var(--muted);margin-top:6px}
.modal{display:none;position:fixed;inset:0;background:rgba(5,10,20,.55);backdrop-filter:blur(4px);z-index:80;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(780px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:19px 19px 0 0;padding:16px}.sheet-head{display:flex;justify-content:space-between;align-items:center}.sheet h3{margin:0;font-size:17px}.close{border:0;background:#f0f3f7;border-radius:9px;padding:7px 10px;color:#536075}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:12px}.detail{padding:9px;background:#f8fafc;border-radius:9px}.detail span{display:block;color:var(--muted);font-size:9px}.detail b{font-size:13px}.sheet-section{margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:10px;color:#536074}.sheet-section strong{color:#26344b}
.empty{text-align:center;padding:36px;color:var(--muted)}.footer{text-align:center;color:var(--muted);font-size:9px;padding:20px 0}.top-link{position:fixed;right:15px;bottom:15px;z-index:35;width:36px;height:36px;border:1px solid var(--line);border-radius:50%;background:#fff;color:#526074;box-shadow:var(--shadow);cursor:pointer}.bottom-nav{display:none}.val-filters{display:flex;gap:7px;overflow:auto;padding:2px 0 8px;scrollbar-width:none}.val-filters button{border:1px solid var(--line);background:#fff;color:#59677b;border-radius:999px;padding:7px 11px;white-space:nowrap;cursor:pointer}.val-filters button.active{background:var(--nav);color:#fff;border-color:var(--nav)}.change-row{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}.change{padding:6px 7px;background:#f8fafc;border-radius:8px;font-size:9px;color:var(--muted)}.change b{display:block;color:#26344b;font-size:10px}.change.up b{color:var(--red)}.change.down b{color:var(--green)}.focus-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:11px}.focus-list{display:grid;gap:7px}.focus-item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 10px;background:#f8fafc;border-radius:10px}.focus-item strong{font-size:11px}.focus-item span{display:block;color:var(--muted);font-size:9px;margin-top:2px}.exposure-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.exposure-row{padding:9px 0;border-bottom:1px solid var(--line)}.exposure-row:last-child{border-bottom:0}.exposure-head{display:flex;justify-content:space-between;font-size:10px}.exposure-bar{height:6px;background:#edf1f5;border-radius:99px;overflow:hidden;margin-top:5px}.exposure-bar i{display:block;height:100%;border-radius:99px;background:#3974e8}
@media(max-width:950px){.grid3{grid-template-columns:repeat(2,1fr)}.radar{grid-template-columns:1fr}.alloc-layout{grid-template-columns:1fr}.health-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.top-in,.main{padding-left:12px;padding-right:12px}.main{padding-top:12px;padding-bottom:82px}.brand p{display:none}.hero{border-radius:17px;padding:15px}.date{font-size:23px}.metric-grid,.grid4,.grid3,.grid2,.health-grid{grid-template-columns:repeat(2,1fr)}.metric{padding:9px}.metric b{font-size:15px}.nav{display:none}.head h2{font-size:16px}.table{min-width:740px}.val-card{min-height:0}.radar-row{grid-template-columns:90px 1fr 48px}.top-link{right:11px;bottom:74px}.bottom-nav{position:fixed;display:grid;grid-template-columns:repeat(6,1fr);left:0;right:0;bottom:0;z-index:70;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(18,31,52,.07)}.bottom-nav button{border:0;background:transparent;color:#718096;font-size:9px;padding:5px 2px;border-radius:9px;cursor:pointer}.bottom-nav button.active{background:var(--nav);color:#fff}.focus-grid,.exposure-grid{grid-template-columns:1fr}}
@media(max-width:390px){.metric-grid,.grid4,.grid3,.grid2,.health-grid{grid-template-columns:1fr}.hero-line{flex-direction:column}.health{align-self:flex-start}.detail-grid{grid-template-columns:1fr 1fr}}
</style>

<body>
<div class="shell">
<header class="top"><div class="top-in"><div class="brand"><div class="logo">王</div><div><h1>小王投资仪表盘</h1><p>每日盯盘 · 估值 · 仓位 · 数据健康</p></div></div><div class="actions"><button class="btn" id="refresh">刷新数据</button></div></div></header>
<div class="main">
<section id="hero"></section>
<nav id="nav" class="nav"></nav>
<main id="views"></main>
<div class="footer">页面读取 GitHub Pages 的 site/data 数据。失败、过期、估算与历史不足均显式标记，不以估算冒充正式当日数据。</div>
</div><nav id="bottomNav" class="bottom-nav" aria-label="移动端主导航"></nav>
<button class="top-link" id="topBtn">↑</button>
</div>
<div class="modal" id="modal"><div class="sheet"><div class="sheet-head"><h3 id="modalTitle">估值详情</h3><button class="close" id="close">关闭</button></div><div id="modalBody"></div></div></div>
<script>
(function(){
'use strict';
var D=null,H=null,view='overview',filter='all',valFilter='all',chartPeriod=5;
var tabs=[['overview','总览'],['holdings','13笔持仓'],['valuation','9个估值'],['allocation','仓位偏离'],['health','数据健康'],['history','历史']];
var $=function(x){return document.getElementById(x)};
function esc(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function n(v,d){if(v==null||v==='')return '—';return Number(v).toFixed(d==null?2:d)}
function stat(s){s=String(s||'—');var bad=/failed|error/i.test(s),warn=/stale|estimate/i.test(s);return '<span class="tag '+(bad?'bad':warn?'warn':'')+'">'+esc(s)+'</span>'}
function state(s){var c=s==='within'?'':'warn';return '<span class="tag '+c+'">'+esc(s||'—')+'</span>'}
function rec(){var a=(H&&H.records)||[];return a.length?a[a.length-1]:{}}
function targets(){return (D.watchlist&&D.watchlist.targets)||[]}
function market(){return (D.latest&&D.latest.market)||{}}
function primary(x){if(x.pe!=null)return ['PE',x.pe];if(x.ps!=null)return ['PS',x.ps];if(x.pb!=null)return ['PB',x.pb];if(x.dividend_yield!=null)return ['股息率',x.dividend_yield+'%'];if(x.gold_usd_oz!=null)return ['金价','$'+x.gold_usd_oz];if(x.erp!=null)return ['ERP',x.erp+'%'];return ['—','—']}
function facts(x){var a=[];function add(k,v){if(v!=null)a.push('<div class="fact"><span>'+esc(k)+'</span><b>'+esc(v)+'</b></div>')}add('PE',x.pe);add('PE历史分位',x.pe_percentile==null?null:x.pe_percentile+'%');add('PB',x.pb);add('PB历史分位',x.pb_percentile==null?null:x.pb_percentile+'%');add('PS',x.ps);add('PS历史分位',x.ps_percentile==null?null:x.ps_percentile+'%');add('股息率',x.dividend_yield==null?null:x.dividend_yield+'%');add('中债10Y',x.cn10y==null?null:x.cn10y+'%');add('利差',x.spread==null?null:x.spread+'pt');add('美债10Y',x.us10y==null?null:x.us10y+'%');add('ERP',x.erp==null?null:x.erp+'%');add('金价',x.gold_usd_oz==null?null:x.gold_usd_oz+' USD/oz');return a.join('')}
function percentile(x){if(x.pe_percentile!=null)return Number(x.pe_percentile);if(x.ps_percentile!=null)return Number(x.ps_percentile);if(x.pb_percentile!=null)return Number(x.pb_percentile);return null}
function obs(key,x){if(key==='gold')return '关注金价、实际利率与美元变化；黄金仅作参考仓位，不设硬性目标。';if(percentile(x)!=null)return '当前历史分位 '+percentile(x).toFixed(2)+'%，继续结合盈利、利率与基本面观察。';if(x.spread!=null)return '股息率与10Y利率利差为 '+x.spread+'pt，观察风险补偿变化。';if(x.erp!=null)return 'ERP为 '+x.erp+'%，同时观察美债利率与盈利预期。';return '当前真实历史序列不足，暂不输出正式L2信号。'}
function longText(key){var z=(D.l2&&D.l2.targets&&D.l2.targets[key])||{};if(z.signal==='reference_only')return '长期判断：黄金为宏观参考锚，不进入正式L2估值。';if(!z.points||z.points<60)return '长期判断：当前真实历史点不足60个，正式L2判断暂缓。';return '长期判断：正式L2='+String(z.signal||'hold')+'；数值来自 valuation_engine.py，不由页面自行计算。'}
function renderNav(){var html=tabs.map(function(t){return '<button class="'+(view===t[0]?'active':'')+'" data-v="'+t[0]+'">'+t[1]+'</button>'}).join('');$('nav').innerHTML=html;if($('bottomNav'))$('bottomNav').innerHTML=html;Array.from(document.querySelectorAll('[data-v]')).forEach(function(b){b.onclick=function(){view=b.dataset.v;render()}})}
function hero(){var df=D.latest._daily_fetch||{},s=(D.portfolio&&D.portfolio.account_summary)||{},ok=Number(df.fund_success_count||0)===Number(df.fund_total||0);$('hero').innerHTML='<section class="hero"><div class="hero-line"><div><div class="eyebrow">最新数据基准日</div><div class="date">'+esc(df.data_basis_date||'—')+'</div><div class="hero-sub">实际运行：'+esc(df.attempted_at||'—')+' · 持仓核验 '+esc(df.fund_success_count||0)+'/'+esc(df.fund_total||0)+'</div></div><div class="health">'+(ok?'● 数据覆盖完整':'● 存在异常/缺口')+'</div></div><div class="metric-grid"><div class="metric"><span>账户总资产</span><b>¥'+n(s.total_assets)+'</b></div><div class="metric"><span>累计盈亏</span><b>¥'+n(s.total_pnl)+'</b></div><div class="metric"><span>今日盈亏</span><b>¥'+n(s.today_pnl)+'</b></div><div class="metric"><span>估值监控</span><b>9 个</b></div></div></section>'}
function overview(){
 var df=D.latest._daily_fetch||{},m=market(),ts=targets(),l2=(D.l2&&D.l2.targets)||{};
 var items=ts.map(function(t){var x=m[t.key]||{},z=l2[t.key]||{},p=z.percentile!=null?Number(z.percentile):percentile(x);var sig=z.signal||'no_data';return '<div class="radar-row"><div class="radar-name">'+esc(t.name)+'</div><div class="track"><i style="width:'+(p==null?0:Math.max(2,Math.min(100,p)))+'%"></i></div><div class="radar-pct">'+(p==null?'—':p.toFixed(1)+'%')+'<div class="sub">'+esc(sig)+'</div></div></div>'}).join('');
 var an=rec().anomalies||[];
 return '<section class="view on"><div class="head"><div><h2>今日总览</h2><p>账户 → 估值 → 仓位 → 数据健康</p></div><div class="head-right">'+esc(df.data_basis_date||'—')+'</div></div><div class="grid4"><div class="card pad"><div class="small-label">持仓覆盖</div><div class="num">'+esc(df.fund_success_count||0)+'/'+esc(df.fund_total||0)+'</div><div class="sub">最新可核验净值</div></div><div class="card pad"><div class="small-label">估值对象</div><div class="num">9</div><div class="sub">核心观察池</div></div><div class="card pad"><div class="small-label">历史数据日</div><div class="num">'+esc((H.records||[]).length)+'</div><div class="sub">运行记录</div></div><div class="card pad"><div class="small-label">正式L2</div><div class="num">'+esc((D.l2&&D.l2.status)||'no_data')+'</div><div class="sub">每个目标 ≥60真实点</div></div></div><div class="head"><div><h2>今日估值雷达</h2><p>分位越高表示历史位置越高；无真实分位时不绘制</p></div></div><div class="radar"><div class="card radar-main">'+items+'</div><div class="side-stack"><div class="card quick"><strong>数据完整性</strong><span>'+(an.length?'存在 '+an.length+' 项异常/历史缺口。':'当前运行未记录异常。')+'</span></div><div class="card quick"><strong>L2</strong><span>正式信号只来自 valuation_engine.py；历史不足60点保持 no_data。</span></div><div class="card quick"><strong>数据链</strong><span>'+((D.history_status&&D.history_status.status)||'not_run')+' · 5年主窗口，稳定后扩展10年。</span></div></div></div><div class="head"><div><h2>估值速览</h2><p>点击卡片打开详情</p></div></div><div class="grid3">'+ts.map(function(t){var x=m[t.key]||{},p=primary(x),z=l2[t.key]||{};return '<article class="card pad click" data-val="'+esc(t.key)+'"><div class="val-top"><div><div class="title">'+esc(t.name)+'</div><div class="code">'+esc(t.index&&t.index.code||'')+'</div></div>'+stat(x.fetch_status)+'</div><div class="primary">'+esc(p[0])+' '+esc(p[1])+'</div><div class="sub">L2 '+esc(z.signal||'no_data')+' · '+esc(z.points||0)+'/60点</div><div class="sub">数据日期 '+esc(x.date||'—')+'</div></article>'}).join('')+'</div>'+focusPanel()+'<div style="margin-top:11px">'+exposurePanel()+'</div></section>'
}

async function loadValuationChanges(){var nodes=Array.from(document.querySelectorAll('[data-change]'));if(!nodes.length)return;var g={};nodes.forEach(function(n){var k=n.dataset.change;(g[k]||(g[k]=[])).push(n)});await Promise.all(Object.keys(g).map(async function(key){var x=market()[key]||{},metric=x.pe!=null?'pe':x.ps!=null?'ps':x.pb!=null?'pb':x.spread!=null?'spread':x.erp!=null?'erp':x.dividend_yield!=null?'dividend_yield':null;if(!metric){g[key].forEach(function(n){n.querySelector('b').textContent='—'});return}try{var r=await fetch('data/history/'+encodeURIComponent(key)+'.csv?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);var text=await r.text(),lines=text.trim().split(/\r?\n/);if(lines.length<2)throw Error('no history');var head=lines[0].split(','),rows=[];for(var i=1;i<lines.length;i++){var p=lines[i].split(','),o={};head.forEach(function(k,j){o[k]=p[j]||''});if(o.date&&o[metric]!==''&&isFinite(Number(o[metric])))rows.push({date:o.date,v:Number(o[metric])})}if(!rows.length)throw Error('no metric');rows.sort(function(a,b){return a.date.localeCompare(b.date)});var latest=rows[rows.length-1],cur=Number(x[metric]);if(!isFinite(cur))cur=latest.v;[1,7,30].forEach(function(days){var target=new Date(latest.date+'T00:00:00Z');target.setUTCDate(target.getUTCDate()-days);var prior=null;for(var j=rows.length-1;j>=0;j--){if(rows[j].date<=target.toISOString().slice(0,10)){prior=rows[j];break}}var val=prior?cur-prior.v:null;g[key].filter(function(n){return Number(n.dataset.period)===days}).forEach(function(n){n.querySelector('b').textContent=val==null?'—':(val>0?'↑ ':'')+val.toFixed(2)+(val<0?' ↓':'');n.classList.toggle('up',val>0);n.classList.toggle('down',val<0)})})}catch(e){g[key].forEach(function(n){n.querySelector('b').textContent='暂无'})}}))}
async function loadHistoryChart(){

 try{var r=await fetch('data/history/'+encodeURIComponent(key)+'.csv?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);var text=await r.text();var lines=text.trim().split(/\\r?\\n/);if(lines.length<2){box.textContent='当前没有足够历史点。';return}
 var head=lines[0].split(',');var rows=[];for(var i=1;i<lines.length;i++){var p=lines[i].split(',');var o={};head.forEach(function(k,j){o[k]=p[j]||''});if(o.date)rows.push(o)}
 var metric=['pe','pb','ps','spread','erp','dividend_yield'].find(function(k){return rows.some(function(x){return x[k]!==''})});if(!metric){box.textContent='该标的暂无可绘制估值序列。';return}
 var data=rows.map(function(x){return {date:x.date,v:Number(x[metric])}}).filter(function(x){return isFinite(x.v)}).slice(-Math.max(60,Math.round(252*chartPeriod)));if(data.length<2){box.textContent='真实点少于2个，暂不绘制曲线。';return}
 var min=Math.min.apply(null,data.map(function(x){return x.v})),max=Math.max.apply(null,data.map(function(x){return x.v}));if(min===max){min-=1;max+=1}var W=900,Hh=210,pad=24,pts=data.map(function(x,i){var px=pad+i/(data.length-1)*(W-2*pad),py=pad+(max-x.v)/(max-min)*(Hh-2*pad);return px.toFixed(1)+','+py.toFixed(1)}).join(' ');var last=data[data.length-1];box.innerHTML='<svg viewBox="0 0 '+W+' '+Hh+'" preserveAspectRatio="none"><polyline fill="none" stroke="#3974e8" stroke-width="3" points="'+pts+'"/><circle cx="'+(W-pad)+'" cy="'+(pad+(max-last.v)/(max-min)*(Hh-2*pad))+'" r="4" fill="#3974e8"/></svg>';cap.textContent=metric.toUpperCase()+' · 绘制最近 '+data.length+' 个真实点 · 最新 '+last.date+' = '+last.v;
 }catch(e){box.textContent='历史曲线加载失败：'+e.message}
