<!doctype html>

<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#6b778c;--line:#e3e8f0;--blue:#2563eb;--green:#087f5b;--amber:#a16207;--red:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1180px;margin:auto;padding:16px 14px 60px}.top{position:sticky;top:0;background:rgba(245,247,251,.94);backdrop-filter:blur(12px);z-index:5;padding-bottom:10px}
h1{margin:0;font-size:22px}.sub,.muted{color:var(--muted);font-size:12px}.tabs{display:flex;gap:7px;overflow:auto;margin-top:12px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;white-space:nowrap}.tabs button.on{background:#eaf1ff;color:var(--blue);border-color:#c8d7ff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 5px 18px #1720330b}.v{font-size:22px;font-weight:800}.k{font-size:11px;color:var(--muted)}section{margin-top:18px}.section-title{font-size:17px;font-weight:800;margin-bottom:8px}
.table{overflow:auto;border:1px solid var(--line);border-radius:12px}.table table{border-collapse:collapse;width:100%;min-width:950px}.table th,.table td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{background:#f8fafc}.tag{display:inline-block;border-radius:999px;padding:3px 7px;font-size:11px;background:#eef2f7}.good{background:#e8f7f1;color:var(--green)}.warn{background:#fff5d9;color:var(--amber)}.bad{background:#fdeceb;color:var(--red)}
.target{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:9px;background:#fff}.target b{font-size:15px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:9px 0}.metric{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:8px}.metric span{display:block;color:var(--muted);font-size:10px}.metric b{font-size:13px}.note{background:#f8fafc;border-radius:11px;padding:9px;font-size:12px}.anomaly{border-left:4px solid #e2a93b;padding:10px;background:#fffdf6;border-radius:9px;margin:7px 0}.history{padding:10px;border:1px solid var(--line);border-radius:11px;margin:7px 0;background:#fff}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.v{font-size:18px}}
.hidden{display:none}
</style></head>

const tabs=[["home","总览"],["holdings","13笔持仓"],["valuation","9个估值"],["allocation","仓位偏离"],["health","数据健康"],["history","历史"]];
function tag(t){let c=t.includes("区间内")||t.includes("当日")||t.includes("正式")||t.includes("低位")?"good":t.includes("高")||t.includes("不足")||t.includes("过期")||t.includes("偏高")||t.includes("低于")?"warn":"neutral";return '<span class="tag '+c+'">'+t+'</span>'}
function render(id){

}
