<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>小王投资仪表盘</title>
<style>
:root{--bg:#f3f6fb;--panel:#fff;--ink:#162033;--muted:#778397;--line:#e8edf4;--nav:#0b1220;--blue:#2f6df6;--blue-soft:#edf4ff;--green:#0d9967;--green-soft:#eaf9f3;--amber:#b97700;--amber-soft:#fff6df;--red:#c93e3e;--red-soft:#fff0f0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button,input{font:inherit}.app-shell{min-height:100vh}.topbar{position:sticky;top:0;z-index:30;background:rgba(243,246,251,.92);backdrop-filter:blur(14px);border-bottom:1px solid rgba(232,237,244,.85)}.topbar-inner{max-width:1220px;margin:auto;padding:13px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:10px}.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--nav);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}.brand h1{margin:0;font-size:17px;letter-spacing:-.3px}.brand p{margin:1px 0 0;color:var(--muted);font-size:11px}.top-actions{display:flex;gap:8px}.icon-btn{border:1px solid var(--line);background:#fff;color:#445166;border-radius:10px;padding:8px 10px;cursor:pointer}
.container{max-width:1220px;margin:auto;padding:18px 18px 42px}.hero{background:linear-gradient(135deg,#0b1220 0%,#172644 100%);color:#fff;border-radius:20px;padding:20px;box-shadow:0 12px 36px rgba(8,20,40,.18)}.hero-top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.eyebrow{font-size:11px;opacity:.62}.hero-date{font-size:26px;font-weight:800;margin:1px 0 3px}.hero-sub{font-size:11px;opacity:.7}.health-chip{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);padding:7px 10px;border-radius:999px;font-size:11px;white-space:nowrap}.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.metric{background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.09);border-radius:13px;padding:11px}.metric span{display:block;color:rgba(255,255,255,.6);font-size:10px}.metric b{display:block;font-size:17px;margin-top:2px}
.section-nav{display:flex;gap:7px;overflow:auto;padding:13px 0 5px;scrollbar-width:none}.section-nav button{border:1px solid var(--line);background:#fff;color:#566275;padding:8px 12px;border-radius:999px;white-space:nowrap;cursor:pointer}.section-nav button.active{background:var(--nav);color:#fff;border-color:var(--nav)}
.view{display:none}.view.active{display:block}.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:15px 2px 10px}.section-head h2{margin:0;font-size:18px}.section-head p{margin:2px 0 0;color:var(--muted);font-size:11px}.head-right{color:var(--muted);font-size:11px}.cards-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.cards-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px}.card.pad{padding:14px}.card-title{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.title{font-weight:750}.sub{font-size:11px;color:var(--muted);margin-top:1px}.status{display:inline-flex;align-items:center;gap:4px;padding:4px 7px;border-radius:999px;background:var(--green-soft);color:var(--green);font-size:10px;font-weight:700}.status.warn{background:var(--amber-soft);color:var(--amber)}.status.bad{background:var(--red-soft);color:var(--red)}.value{font-size:24px;font-weight:800;margin:11px 0 1px;letter-spacing:-.5px}.tiny{font-size:10px;color:var(--muted)}.divider{border-top:1px solid var(--line);margin:13px 0}.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mini{background:#f8fafc;border-radius:10px;padding:8px}.mini span{display:block;font-size:10px;color:var(--muted)}.mini b{font-size:13px}.note{font-size:11px;color:#5d6979;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:9px 10px}.clickable{cursor:pointer;transition:transform .16s,box-shadow .16s}.clickable:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(18,31,52,.08)}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{padding:13px;border:1px solid var(--line);background:#fff;border-radius:13px}.kpi .label{color:var(--muted);font-size:10px}.kpi .num{font-size:19px;font-weight:800;margin-top:3px}
.val-card{padding:14px;min-height:190px}.val-score{display:flex;justify-content:space-between;align-items:end;margin:11px 0 8px}.val-main{font-size:22px;font-weight:800}.badge{font-size:10px;padding:4px 7px;border-radius:999px;background:var(--blue-soft);color:var(--blue)}.facts{display:grid;grid-template-columns:1fr 1fr;gap:7px}.fact{background:#f8fafc;border-radius:9px;padding:7px 8px}.fact span{display:block;font-size:9px;color:var(--muted)}.fact b{font-size:12px}.observation{margin-top:9px;background:#fbfcfe;border:1px solid var(--line);border-radius:10px;padding:9px;font-size:11px;color:#526073}.observation strong{color:#243249}
.toolbar{display:flex;gap:8px;align-items:center;margin:10px 0}.search{flex:1;min-width:0;border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 11px;outline:none}.search:focus{border-color:#a9c1f8;box-shadow:0 0 0 3px var(--blue-soft)}.filter-btn{border:1px solid var(--line);background:#fff;color:#536074;border-radius:10px;padding:9px 11px;cursor:pointer}.filter-btn.active{background:var(--blue-soft);color:var(--blue);border-color:#cbdcff}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:15px;background:#fff}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{font-size:10px;color:var(--muted);font-weight:700;background:#fbfcfe}.table tr:last-child td{border-bottom:0}.table td:first-child{font-weight:700}.state{font-size:10px;padding:4px 7px;border-radius:999px;background:#f1f5f9;color:#516074}.state.ok{background:var(--green-soft);color:var(--green)}.state.warn{background:var(--amber-soft);color:var(--amber)}
.alloc{display:grid;grid-template-columns:260px 1fr;gap:12px}.donut-card{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px}.donut{width:178px;height:178px;border-radius:50%;background:conic-gradient(#2f6df6 0 15.3%,#7a9eea 15.3% 30.4%,#8bcfba 30.4% 45.1%,#e2a95e 45.1% 59.4%,#b8c6d9 59.4% 100%);position:relative}.donut:after{content:"";position:absolute;inset:36px;border-radius:50%;background:#fff}.donut-center{position:absolute;inset:0;display:grid;place-items:center;z-index:2;text-align:center}.donut-center b{font-size:22px}.donut-center span{display:block;font-size:10px;color:var(--muted)}.alloc-list{padding:3px 14px}.alloc-item{padding:11px 0;border-bottom:1px solid var(--line)}.alloc-item:last-child{border-bottom:0}.alloc-top{display:flex;justify-content:space-between;gap:10px}.alloc-name{font-weight:700}.alloc-meta{font-size:10px;color:var(--muted)}.alloc-track{height:7px;background:#eef2f7;border-radius:99px;margin:7px 0;overflow:hidden}.alloc-track i{display:block;height:100%;border-radius:99px}.alloc-foot{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
.health-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.health-num{font-size:26px;font-weight:800;margin-top:8px}.anomaly{padding:10px;border-radius:11px;background:var(--amber-soft);color:#6f520d;border:1px solid #f2dfaa;font-size:11px}.empty{padding:35px;text-align:center;color:var(--muted)}
.history-list{display:grid;gap:9px}.history-item{padding:12px 14px}.history-top{display:flex;justify-content:space-between;gap:10px}.history-date{font-weight:750}.history-bottom{display:flex;gap:16px;margin-top:6px;font-size:10px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(7,13,24,.56);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;z-index:60}.modal.show{display:flex}.sheet{width:min(760px,100%);background:#fff;border-radius:20px 20px 0 0;max-height:86vh;overflow:auto;padding:16px}.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.close{border:0;background:#f1f4f8;border-radius:10px;padding:7px 10px;color:#566174;cursor:pointer}.sheet h3{margin:0;font-size:18px}.sheet-body{margin-top:12px}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.detail-box{background:#f8fafc;border-radius:10px;padding:10px}.detail-box span{display:block;color:var(--muted);font-size:10px}.detail-box b{font-size:14px}.footer{padding:22px 2px 0;color:var(--muted);font-size:10px;text-align:center}
@media(max-width:900px){.cards-3{grid-template-columns:repeat(2,1fr)}.metric-grid{grid-template-columns:repeat(2,1fr)}.alloc{grid-template-columns:1fr}.health-grid{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.topbar-inner,.container{padding-left:12px;padding-right:12px}.container{padding-top:12px}.brand h1{font-size:16px}.hero{padding:16px;border-radius:17px}.hero-date{font-size:23px}.metric b{font-size:15px}.section-head h2{font-size:16px}.val-card{min-height:0}.table{min-width:700px}.toolbar{position:sticky;top:59px;z-index:20;background:var(--bg);padding:5px 0}.sheet{border-radius:18px 18px 0 0}.detail-grid{grid-template-columns:1fr 1fr}}
@media(max-width:420px){.metric-grid,.kpi-row,.cards-3,.cards-2,.health-grid{grid-template-columns:1fr}.hero-top{flex-direction:column}.health-chip{align-self:flex-start}}
</style>
</head>
<body>
<div class="app-shell">
  <header class="topbar"><div class="topbar-inner"><div class="brand"><div class="brand-mark">王</div><div><h1>小王投资仪表盘</h1><p>持仓 · 估值 · 仓位 · 数据健康</p></div></div><div class="top-actions"><button class="icon-btn" id="refreshBtn">刷新</button></div></div></header>
  <div class="container">
    <section id="hero"></section>
    <nav class="section-nav" id="nav"></nav>
    <main id="views"></main>
    <div class="footer">数据页面仅展示已写入 site/data 的运行结果；失败、过期与历史不足会显式标记，不伪造数据。</div>
  </div>
</div>
<div class="modal" id="modal"><div class="sheet"><div class="sheet-head"><h3 id="modalTitle">详情</h3><button class="close" id="closeModal">关闭</button></div><div class="sheet-body" id="modalBody"></div></div></div>
<script>
(function(){
'use strict';
var D=null,H=null,activeView='overview',activeFilter='all';
var tabs=[['overview','总览'],['holdings','13笔持仓'],['valuation','9个估值'],['allocation','仓位偏离'],['health','数据健康'],['history','历史']];
var $=function(id){return document.getElementById(id)};
function esc(v){return String(v===undefined||v===null?'':v).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]})}
function num(v,d){return v===null||v===undefined||v===''?'—':Number(v).toFixed(d===undefined?2:d)}
function status(v){var s=String(v||'—'),bad=/failed|error/i.test(s),warn=/stale|estimate/i.test(s);return '<span class="status '+(bad?'bad':warn?'warn':'')+'">'+esc(s)+'</span>'}
function pills(v,state){return '<span class="state '+(state==='within'?'ok':state==='above'||state==='below'?'warn':'')+'">'+esc(v)+'</span>'}
function latestRecord(){var a=H&&Array.isArray(H.records)?H.records:[];return a.length?a[a.length-1]:{}}
function valPrimary(x){if(x.pe!==undefined)return ['PE',x.pe];if(x.ps!==undefined)return ['PS',x.ps];if(x.pb!==undefined)return ['PB',x.pb];if(x.dividend_yield!==undefined)return ['股息率',x.dividend_yield+'%'];if(x.gold_usd_oz!==undefined)return ['金价','$'+x.gold_usd_oz];if(x.erp!==undefined)return ['ERP',x.erp+'%'];return ['—','—']}
function valFacts(x){var a=[];function add(k,v){if(v!==undefined&&v!==null)a.push('<div class="fact"><span>'+esc(k)+'</span><b>'+esc(v)+'</b></div>')}
add('PE',x.pe);add('PE历史分位',x.pe_percentile===undefined?undefined:x.pe_percentile+'%');add('PB',x.pb);add('PB历史分位',x.pb_percentile===undefined?undefined:x.pb_percentile+'%');add('PS',x.ps);add('PS历史分位',x.ps_percentile===undefined?undefined:x.ps_percentile+'%');add('股息率',x.dividend_yield===undefined?undefined:x.dividend_yield+'%');add('中债10Y',x.cn10y===undefined?undefined:x.cn10y+'%');add('利差',x.spread===undefined?undefined:x.spread+'pt');add('美债10Y',x.us10y===undefined?undefined:x.us10y+'%');add('ERP',x.erp===undefined?undefined:x.erp+'%');add('金价',x.gold_usd_oz===undefined?undefined:x.gold_usd_oz+' USD/oz');return a.join('')}
function observation(key,x){if(key==='gold')return '关注金价趋势、实际利率与美元变化；黄金为参考仓位，不设硬目标。';if(x.pe_percentile!==undefined)return '今日观察：PE历史分位 '+x.pe_percentile+'%，继续结合盈利与利率观察估值变化。';if(x.ps_percentile!==undefined)return '今日观察：PS历史分位 '+x.ps_percentile+'%，同时核对盈利质量与估值变化。';if(x.pb_percentile!==undefined)return '今日观察：PB历史分位 '+x.pb_percentile+'%，结合盈利周期观察。';if(x.spread!==undefined)return '今日观察：股息率与10Y利率利差 '+x.spread+'pt，观察风险补偿变化。';if(x.erp!==undefined)return '今日观察：ERP '+x.erp+'%，同时关注美债利率与盈利预期。';return '当前展示已有真实数据；正式L2需要至少60个真实历史点。'}
function longJudgement(x){return x.status==='no_data'?'长期判断：真实历史序列不足，暂不输出正式L2判断。':'长期判断：以正式估值引擎输出为准；页面不自行计算交易信号。'}
function renderNav(){$('nav').innerHTML=tabs.map(function(t){return '<button class="'+(t[0]===activeView?'active':'')+'" data-view="'+t[0]+'">'+t[1]+'</button>'}).join('');Array.from($('nav').querySelectorAll('button')).forEach(function(b){b.onclick=function(){activeView=b.getAttribute('data-view');render()}})}
function renderHero(){var L=D.latest||{},S=(D.portfolio||{}).account_summary||{},df=L._daily_fetch||{};var complete=(df.fund_success_count||0)===(df.fund_total||0);$('hero').innerHTML='<section class="hero"><div class="hero-top"><div><div class="eyebrow">最新数据基准日</div><div class="hero-date">'+esc(df.data_basis_date||'—')+'</div><div class="hero-sub">运行于 '+esc(df.attempted_at||'—')+' · '+esc(df.fund_success_count||0)+' / '+esc(df.fund_total||0)+' 笔持仓已核验</div></div><div class="health-chip">'+(complete?'数据覆盖完整':'存在数据异常')+'</div></div><div class="metric-grid"><div class="metric"><span>账户总资产</span><b>¥'+num(S.total_assets,2)+'</b></div><div class="metric"><span>累计盈亏</span><b>¥'+num(S.total_pnl,2)+'</b></div><div class="metric"><span>今日盈亏</span><b>¥'+num(S.today_pnl,2)+'</b></div><div class="metric"><span>估值监控</span><b>9 个</b></div></div></section>'}
function overview(){var M=(D.latest||{}).market||{},targets=D.watchlist&&D.watchlist.targets||[],df=(D.latest||{})._daily_fetch||{};return '<section class="view active"><div class="section-head"><div><h2>今日概览</h2><p>先看账户，再看估值与数据健康</p></div><div class="head-right">'+esc(df.data_basis_date||'—')+'</div></div><div class="kpi-row"><div class="kpi"><div class="label">持仓覆盖</div><div class="num">'+esc(df.fund_success_count||0)+' / '+esc(df.fund_total||0)+'</div></div><div class="kpi"><div class="label">估值对象</div><div class="num">9</div></div><div class="kpi"><div class="label">历史数据日</div><div class="num">'+esc((H.records||[]).length)+'</div></div><div class="kpi"><div class="label">L2状态</div><div class="num">'+esc((D.l2&&D.l2.status)||'no_data')+'</div></div></div><div class="section-head"><div><h2>估值速览</h2><p>点击卡片查看指标与今日观察</p></div></div><div class="cards-3">'+targets.map(function(t){var x=M[t.key]||{},p=valPrimary(x);return '<article class="card pad clickable" data-val="'+esc(t.key)+'"><div class="card-title"><div><div class="title">'+esc(t.name)+'</div><div class="sub">'+esc(t.index&&t.index.code||'')+'</div></div>'+status(x.fetch_status)+'</div><div class="value">'+esc(p[0])+' <span style="font-weight:700">'+esc(p[1])+'</span></div><div class="tiny">数据日期 '+esc(x.date||'—')+'</div></article>'}).join('')+'</div><div class="cards-2" style="margin-top:12px"><div class="card pad"><div class="title">数据规则</div><div class="note" style="margin-top:9px">失败、估算、过期数据保留原日期并标记；历史序列只接受真实点位，不插值、不模拟。</div></div><div class="card pad"><div class="title">黄金规则</div><div class="note" style="margin-top:9px">黄金只做参考仓位监控，不设置硬性目标仓位。</div></div></div></section>'}
function holdings(){return '<section class="view active"><div class="section-head"><div><h2>13笔实际持仓</h2><p>净值日期与抓取状态分开显示</p></div></div><div class="toolbar"><input id="holdSearch" class="search" placeholder="搜索基金名称或代码"><button class="filter-btn '+(activeFilter==='all'?'active':'')+'" data-filter="all">全部</button><button class="filter-btn '+(activeFilter==='stale'?'active':'')+'" data-filter="stale">异常</button></div><div class="table-wrap"><table class="table"><thead><tr><th>基金</th><th>持仓金额</th><th>占比</th><th>净值</th><th>净值日期</th><th>状态</th></tr></thead><tbody id="holdBody"></tbody></table></div></section>'}
function paintHoldings(){var body=$('holdBody');if(!body)return;var q=(($('holdSearch')||{}).value||'').toLowerCase();var hs=(D.portfolio&&D.portfolio.holdings)||[],funds=(D.latest&&D.latest.funds)||{},total=Number((D.portfolio.account_summary||{}).total_assets||0);var rows=hs.filter(function(h){var x=funds[h.code]||{};var match=!q||String(h.name).toLowerCase().indexOf(q)>=0||String(h.code).toLowerCase().indexOf(q)>=0;var anomaly=activeFilter==='all'||x.fetch_status!=='verified_latest';return match&&anomaly}).map(function(h){var x=funds[h.code]||{},p=total?100*Number(h.holding_value||0)/total:0;return '<tr><td>'+esc(h.name)+'<div class="sub">'+esc(h.code)+'</div></td><td>¥'+num(h.holding_value,2)+'</td><td>'+p.toFixed(1)+'%</td><td>'+esc(num(x.nav,4))+'</td><td>'+esc(x.date||'—')+'</td><td>'+status(x.fetch_status)+'</td></tr>'}).join('');body.innerHTML=rows||'<tr><td colspan="6" class="empty">没有匹配项目</td></tr>'}
function valuation(){var M=(D.latest||{}).market||{},targets=D.watchlist&&D.watchlist.targets||[];return '<section class="view active"><div class="section-head"><div><h2>9个估值监控</h2><p>当前指标、历史分位、今日观察与数据来源</p></div><div class="head-right">L2 ≥ 60 真实历史点</div></div><div class="cards-3">'+targets.map(function(t){var x=M[t.key]||{},p=valPrimary(x);return '<article class="card val-card clickable" data-val="'+esc(t.key)+'"><div class="card-title"><div><div class="title">'+esc(t.name)+'</div><div class="sub">'+esc(t.index&&t.index.code||'')+'</div></div>'+status(x.fetch_status)+'</div><div class="val-score"><div class="val-main">'+esc(p[0])+' '+esc(p[1])+'</div><span class="badge">点开详情</span></div><div class="facts">'+valFacts(x)+'</div><div class="observation"><strong>'+esc(observation(t.key,x))+'</strong></div></article>'}).join('')+'</div></section>'}
function allocation(){var rec=latestRecord(),a=rec.allocation_deviation||[];var total=0;a.forEach(function(x){if(x.key!=='reserve')total+=Number(x.current_pct||0)});var colors=['#2f6df6','#6f93df','#8bcfba','#e2a95e','#a9b9d2'];return '<section class="view active"><div class="section-head"><div><h2>仓位偏离</h2><p>参考区间监控，不自动调仓</p></div><div class="head-right">'+esc(rec.data_basis_date||'—')+'</div></div><div class="alloc"><div class="card donut-card"><div class="donut"><div class="donut-center"><div><b>'+total.toFixed(1)+'%</b><span>已映射仓位</span></div></div></div><div class="tiny" style="margin-top:12px">黄金仅作参考，reserve 为未映射持仓汇总</div></div><div class="card alloc-list">'+a.map(function(x,i){var cur=Number(x.current_pct||0),width=Math.min(100,cur*4);return '<div class="alloc-item"><div class="alloc-top"><div class="alloc-name">'+esc(x.key)+'</div>'+pills(x.state,x.state)+'</div><div class="alloc-meta">当前 '+cur.toFixed(1)+'% · 中心 '+Number(x.reference_pct||0).toFixed(1)+'% · 区间 '+(x.range_pct||[]).join('–')+'%</div><div class="alloc-track"><i style="width:'+width+'%;background:'+colors[i%colors.length]+'"></i></div><div class="alloc-foot"><span>偏离中心 '+(cur-Number(x.reference_pct||0)).toFixed(1)+'pt</span><span>监控</span></div></div>'}).join('')+'</div></div></section>'}
function health(){var rec=latestRecord(),an=rec.anomalies||[],df=(D.latest||{})._daily_fetch||{};return '<section class="view active"><div class="section-head"><div><h2>数据健康</h2><p>把失败、历史不足和异常直接展示出来</p></div></div><div class="health-grid"><div class="card pad"><div class="title">持仓数据</div><div class="health-num">'+esc(df.fund_success_count||0)+' / '+esc(df.fund_total||0)+'</div><div class="sub">核验覆盖</div></div><div class="card pad"><div class="title">历史数据日</div><div class="health-num">'+esc((H.records||[]).length)+'</div><div class="sub">当前仪表盘记录</div></div><div class="card pad"><div class="title">正式L2</div><div class="health-num">'+esc((D.l2&&D.l2.status)||'no_data')+'</div><div class="sub">≥60个真实点才进入正式计算</div></div></div><div class="section-head"><div><h2>异常明细</h2></div></div><div class="card pad">'+(an.length?an.map(function(x){return '<div class="anomaly" style="margin-bottom:8px"><b>'+esc(x.target||'异常')+'</b> · '+esc(x.type||'')+'<div style="margin-top:3px">'+esc(x.message||'')+'</div></div>'}).join(''):'<div class="note">当前运行没有记录异常。</div>')+'</div></section>'}
function history(){var rs=(H.records||[]).slice().reverse();return '<section class="view active"><div class="section-head"><div><h2>历史运行</h2><p>按数据基准日保存，避免同一天重复写入</p></div></div><div class="history-list">'+(rs.length?rs.map(function(x){return '<div class="card history-item"><div class="history-top"><div class="history-date">'+esc(x.data_basis_date||'—')+'</div>'+pills(x.completeness||'—','')+'</div><div class="history-bottom"><span>运行 '+esc(x.run_at||'—')+'</span><span>持仓 '+esc(x.fund_success_count||'—')+'/'+esc(x.fund_total||'—')+'</span><span>异常 '+esc((x.anomalies||[]).length)+'</span></div></div>'}).join(''):'<div class="card empty">暂无历史记录</div>')+'</div></section>'}
function render(){renderNav();renderHero();var html=activeView==='overview'?overview():activeView==='holdings'?holdings():activeView==='valuation'?valuation():activeView==='allocation'?allocation():activeView==='health'?health():history();$('views').innerHTML=html;bind();if(activeView==='holdings')paintHoldings()}
function bind(){Array.from(document.querySelectorAll('[data-val]')).forEach(function(el){el.onclick=function(){openVal(el.getAttribute('data-val'))}});if($('refreshBtn'))$('refreshBtn').onclick=function(){load(true)};if($('holdSearch'))$('holdSearch').oninput=paintHoldings;Array.from(document.querySelectorAll('[data-filter]')).forEach(function(b){b.onclick=function(){activeFilter=b.getAttribute('data-filter');render()}})}
function openVal(key){var t=(D.watchlist.targets||[]).filter(function(x){return x.key===key})[0];var x=((D.latest||{}).market||{})[key]||{};if(!t)return;$('modalTitle').textContent=t.name+' · '+(t.index&&t.index.code||'');$('modalBody').innerHTML='<div class="detail-grid">'+valFacts(x).replace(/class="fact"/g,'class="detail-box"')+'</div><div class="observation" style="margin-top:12px"><strong>今日观察</strong><div style="margin-top:5px">'+esc(observation(key,x))+'</div></div><div class="observation" style="margin-top:8px"><strong>长期判断</strong><div style="margin-top:5px">'+esc(longJudgement(x))+'</div></div><div class="note" style="margin-top:8px">数据日期：'+esc(x.date||'—')+' · 来源：'+esc(x.source||'—')+' · 状态：'+esc(x.fetch_status||'—')+'</div>';$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
$('closeModal').onclick=closeModal;$('modal').onclick=function(e){if(e.target===$('modal'))closeModal()};document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});
async function getJSON(path){var r=await fetch(path+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(path+' HTTP '+r.status);return r.json()}
async function load(){try{var pair=await Promise.all([getJSON('data/latest.json'),getJSON('data/history.json')]);D=pair[0];H=pair[1];render()}catch(e){$('hero').innerHTML='';$('nav').innerHTML='';$('views').innerHTML='<div class="card empty"><b>数据加载失败</b><div style="margin-top:7px">'+esc(e.message)+'</div><button class="icon-btn" style="margin-top:12px" onclick="location.reload()">重新加载</button></div>'}}
load();setInterval(load,60000);window.openVal=openVal;
})();
</script>
</body>
</html>
