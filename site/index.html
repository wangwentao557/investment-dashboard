<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小王投资盯盘站</title>
<style>body{font:14px system-ui;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:16px}.card{background:white;border:1px solid #e3e8f0;border-radius:14px;padding:14px;margin:10px 0}table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #eee;text-align:left}.tabs{display:flex;gap:6px;overflow:auto}.tabs button{padding:8px;border:1px solid #ddd;border-radius:20px;background:white}.hidden{display:none}.good{background:#e8f7f1}</style></head>
<body><div class="wrap"><h1>小王投资盯盘站</h1><div id="meta"></div><div class="tabs" id="tabs"></div><main id="app"></main></div>
<script>
let D,H;
const tabs=[["overview","总览"],["holdings","13笔持仓"],["valuation","9个估值"],["allocation","仓位偏离"],["health","数据健康"],["history","历史"]];
function esc(s){return String(s??"").replace(/[&<>]/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[x]))}
function show(k,b){document.querySelectorAll("main>section").forEach(x=>x.classList.add("hidden"));document.getElementById(k).classList.remove("hidden");document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("good"));b.classList.add("good")}
async function load(){
 D=await fetch("data/latest.json?x="+Date.now()).then(r=>r.json());
 H=await fetch("data/history.json?x="+Date.now()).then(r=>r.json());
 const L=D.latest,M=L.market||{};
 document.getElementById("meta").innerHTML='<div class="card">数据基准日：<b>'+esc(L._daily_fetch.data_basis_date)+'</b>　运行：'+esc(L._daily_fetch.attempted_at)+'<br>13笔持仓 · 9个估值监控 · 正式L2门槛60个真实历史点</div>';
 document.getElementById("tabs").innerHTML=tabs.map(t=>'<button onclick="show(\''+t[0]+'\',this)">'+t[1]+"</button>").join("");
 document.getElementById("app").innerHTML=
 '<section id="overview"><div class="card"><h2>当前状态</h2><p>网站只读取 site/data。失败、估算、过期数据保留真实日期并显式标记，不冒充当日正式数据。</p><p>黄金仅作为参考仓位，不设硬目标。</p></div></section>'+
 '<section id="holdings" class="hidden"><div class="card"><h2>13笔实际持仓</h2><table><tr><th>基金</th><th>金额</th><th>净值</th><th>日期</th><th>状态</th></tr>'+
 D.portfolio.holdings.map(h=>{const x=L.funds[h.code]||{};return "<tr><td>"+esc(h.name)+"</td><td>¥"+h.holding_value.toFixed(2)+"</td><td>"+(x.nav??"—")+"</td><td>"+esc(x.date||"—")+"</td><td>"+esc(x.fetch_status||"—")+"</td></tr>"}).join("")+
 '</table></div></section>'+
 '<section id="valuation" class="hidden"><div class="card"><h2>9个估值监控</h2>'+
 D.watchlist.targets.map(t=>{const x=M[t.key]||{};return '<div class="card"><b>'+esc(t.name)+" · "+esc(t.index.code)+'</b><pre>'+esc(JSON.stringify(x,null,2))+"</pre></div>"}).join("")+
 '</div></section>'+
 '<section id="allocation" class="hidden"><div class="card"><h2>参考仓位偏离</h2><p>只用于监控，不是硬性目标，不自动调仓。</p><table><tr><th>标的</th><th>当前</th><th>中心</th><th>区间</th><th>状态</th></tr>'+
 ((H.records.at(-1)?.allocation_deviation)||[]).map(x=>"<tr><td>"+esc(x.key)+"</td><td>"+x.current_pct+"%</td><td>"+x.reference_pct+"%</td><td>"+x.range_pct.join("–")+"%</td><td>"+esc(x.state)+"</td></tr>").join("")+
 '</table></div></section>'+
 '<section id="health" class="hidden"><div class="card"><h2>数据健康</h2><pre>'+esc(JSON.stringify({l2:D.l2,anomalies:H.records.at(-1)?.anomalies||[]},null,2))+'</pre></div></section>'+
 '<section id="history" class="hidden"><div class="card"><h2>历史</h2>'+
 H.records.slice().reverse().map(x=>'<div class="card"><b>'+esc(x.data_basis_date)+"</b>　"+esc(x.completeness||"")+"</div>").join("")+
 '</div></section>';
}
load();setInterval(load,60000);
</script></body></html>
