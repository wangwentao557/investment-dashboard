name: Daily investment dashboard update
on:
  schedule:
    - cron: "30 9 * * *" # 17:30 Asia/Shanghai, every day
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional data date override (YYYY-MM-DD). Leave blank for today."
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: investment-daily-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIXINGER_TOKEN: ${{ secrets.LIXINGER_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Resolve target date
        run: |
          if [ -n "${{ inputs.target_date }}" ]; then
            TARGET_DATE="${{ inputs.target_date }}"
          else
            TARGET_DATE="$(TZ=Asia/Shanghai date +%F)"
          fi
          echo "TARGET_DATE=$TARGET_DATE" >> "$GITHUB_ENV"
          echo "Using target date: $TARGET_DATE"
      - name: Backfill 5y/10y valuation history
        run: python history_backfill.py --date "$TARGET_DATE" --years 5 --extend-years 10
      - name: Update today's data and run L2
        run: python dashboard_updater.py --date "$TARGET_DATE"
      - name: Data quality gate
        run: |
          python - <<'PY'
          import json, sys
          p=json.load(open("data/market_snapshot_latest.json", encoding="utf-8"))
          meta=p.get("_daily_fetch", {})
          ok=meta.get("fund_success_count", 0)
          total=meta.get("fund_total", 0)
          print(f"Fund formal NAV success: {ok}/{total}")
          if ok == 0:
              print("ERROR: 0 formal fund NAVs were fetched; refusing to publish stale/empty daily data.")
              sys.exit(1)
          PY
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet || git commit -m "data: daily investment update $TARGET_DATE"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
              git reset --hard origin/main
              git add data site/data
              git diff --cached --quiet || git commit -m "data: daily investment update $TARGET_DATE"
            fi
            sleep 10
          done
          echo "ERROR: unable to push daily data after 3 attempts"
          exit 1
