name: Daily investment dashboard update
on:
  schedule:
    - cron: "30 9 * * *" # 17:30 Asia/Shanghai, every day
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional data date override (YYYY-MM-DD). Leave blank for today."
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: investment-daily-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIXINGER_TOKEN: ${{ secrets.LIXINGER_TOKEN }}
      PRIVATE_DATA_REPO: ${{ secrets.PRIVATE_DATA_REPO }}
      PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Load private account data
        shell: bash
        run: |
          if [ -z "$PRIVATE_DATA_REPO" ] || [ -z "$PRIVATE_DATA_TOKEN" ]; then
            echo "ERROR: Configure PRIVATE_DATA_REPO and PRIVATE_DATA_TOKEN secrets; account data will not fall back to the public repository."
            exit 1
          fi
          case "$PRIVATE_DATA_REPO" in */*) ;; *) echo "ERROR: PRIVATE_DATA_REPO must be owner/repository"; exit 1;; esac
          git clone "https://x-access-token:${PRIVATE_DATA_TOKEN}@github.com/${PRIVATE_DATA_REPO}.git" /tmp/private-account
          if [ ! -s /tmp/private-account/portfolio.json ]; then
            echo "ERROR: private repository must contain portfolio.json; refusing to reconstruct or invent holdings."
            exit 1
          fi
          if [ ! -s /tmp/private-account/dashboard_history.json ]; then
            echo "ERROR: private repository must contain dashboard_history.json. Copy the existing history from the pre-migration main branch before merging; refusing to replace it with an empty history."
            exit 1
          fi
          python -m json.tool /tmp/private-account/portfolio.json >/dev/null
          python -m json.tool /tmp/private-account/dashboard_history.json >/dev/null
          echo "PORTFOLIO_PATH=/tmp/private-account/portfolio.json" >> "$GITHUB_ENV"
          echo "PRIVATE_HISTORY_PATH=/tmp/private-account/dashboard_history.json" >> "$GITHUB_ENV"
      - name: Resolve target date
        run: |
          if [ -n "${{ inputs.target_date }}" ]; then
            TARGET_DATE="${{ inputs.target_date }}"
          else
            TARGET_DATE="$(TZ=Asia/Shanghai date +%F)"
          fi
          echo "TARGET_DATE=$TARGET_DATE" >> "$GITHUB_ENV"
          echo "Using target date: $TARGET_DATE"
      - name: Backfill 5y/10y valuation history
        run: python history_backfill.py --date "$TARGET_DATE" --years 5 --extend-years 10
      - name: Update today's data and run L2
        run: python dashboard_updater.py --date "$TARGET_DATE"
      - name: Persist private account state
        shell: bash
        run: |
          git -C /tmp/private-account config user.name "github-actions[bot]"
          git -C /tmp/private-account config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/private-account add portfolio.json dashboard_history.json
          if ! git -C /tmp/private-account diff --cached --quiet; then
            git -C /tmp/private-account commit -m "private data: update account ledger $TARGET_DATE"
            git -C /tmp/private-account push origin HEAD
          fi
      - name: Data quality gate
        run: |
          python - <<'PY'
          import json, sys
          p=json.load(open("data/market_snapshot_latest.json", encoding="utf-8"))
          meta=p.get("_daily_fetch", {})
          ok=meta.get("fund_success_count", 0)
          total=meta.get("fund_total", 0)
          print(f"Fund formal NAV success: {ok}/{total}")
          if ok == 0:
              print("ERROR: 0 formal fund NAVs were fetched; refusing to publish stale/empty daily data.")
              sys.exit(1)
          PY
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet || git commit -m "data: daily investment update $TARGET_DATE"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
              git reset --hard origin/main
              git add data site/data
              git diff --cached --quiet || git commit -m "data: daily investment update $TARGET_DATE"
            fi
            sleep 10
          done
          echo "ERROR: unable to push daily data after 3 attempts"
          exit 1
