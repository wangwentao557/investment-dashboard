name: Daily investment dashboard update
on:
  schedule:
    - cron: "30 9 * * *" # 17:30 Asia/Shanghai, every day
  workflow_dispatch:
  push:
    paths:
      - ".github/daily.trigger"
      - ".github/workflows/daily_update.yml"
permissions:
  contents: write
concurrency:
  group: investment-daily-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIXINGER_TOKEN: ${{ secrets.LIXINGER_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Resolve target date
        run: echo "TARGET_DATE=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_ENV"
      - name: Backfill 5y/10y valuation history
        run: python history_backfill.py --date "$TARGET_DATE" --years 5 --extend-years 10
      - name: Update today's data and run L2
        run: python dashboard_updater.py --date "$TARGET_DATE"
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet || git commit -m "data: daily investment update $TARGET_DATE"
          git push
