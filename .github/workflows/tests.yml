name: Python tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile Python files
        run: python -m compileall -q dashboard_updater.py sync_site.py account_import.py tests
      - name: Run account importer tests
        run: python -m unittest discover -s tests -v
