name: Validate dashboard privacy and account import
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile dashboard_updater.py sync_site.py account_import.py privacy_check.py
      - name: Account import tests
        run: python -m unittest discover -s tests -v
      - name: Public data privacy gate
        run: python privacy_check.py
